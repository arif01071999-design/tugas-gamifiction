// XP notification
function showXPNotification(amount) {
  const notif = document.createElement('div');
  notif.className = 'xp-notification animate-xp-fly text-primary font-bold text-xl';
  notif.textContent = `+${amount} XP ✨`;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 1500);
}

function addXP(amount) {
  gameState.player.xp += amount;
  if (gameState.player.xp >= gameState.player.level * 200) {
    gameState.player.level++;
    gameState.player.xp = 0;
  }
  showXPNotification(amount);
}

// Render functions
function render() {
  const app = document.getElementById('app');
  switch(gameState.currentScreen) {
    case 'landing': app.innerHTML = renderLanding(); break;
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'story': app.innerHTML = renderStoryMode(); break;
    case 'dialogue': app.innerHTML = renderDialogue(); break;
    case 'achievements': app.innerHTML = renderAchievements(); break;
    case 'minigames': app.innerHTML = renderMiniGames(); break;
    case 'vocab_game': app.innerHTML = renderVocabGame(); break;
    case 'grammar_game': app.innerHTML = renderGrammarGame(); break;
    case 'results': app.innerHTML = renderResults(); break;
    default: app.innerHTML = renderLanding();
  }
  lucide.createIcons();
}

function startLevel(levelId) {
  dialogueState = { levelId, current: 0, score: 0, answered: false, completed: false };
  gameState.currentScreen = 'dialogue';
  render();
}

function renderDialogue() {
  const level = levels[dialogueState.levelId - 1];
  const levelDialogues = dialogues[dialogueState.levelId] || dialogues[1];
  
  if (dialogueState.completed) {
    return renderLevelComplete();
  }

  const current = levelDialogues[dialogueState.current];
  
  return `
  <div class="h-full flex flex-col">
    ${renderNav()}
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <div class="max-w-3xl mx-auto">
        <!-- Level Header -->
        <div class="flex items-center justify-between mb-6">
          <button onclick="gameState.currentScreen='story';render()" class="flex items-center gap-2 text-gray-500 hover:text-gray-800 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            <span class="font-semibold">Back</span>
          </button>
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-gray-500">${dialogueState.current + 1}/${levelDialogues.length}</span>
            <div class="w-32 bg-gray-200 rounded-full h-2">
              <div class="bg-primary rounded-full h-2 transition-all" style="width:${((dialogueState.current+1)/levelDialogues.length)*100}%"></div>
            </div>
          </div>
        </div>

        <!-- Scene -->
        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-3xl p-8 mb-6 relative overflow-hidden">
          <div class="absolute top-4 right-4 text-4xl opacity-30">${level.emoji}</div>
          <p class="text-sm font-semibold text-primary mb-1">Level ${level.id}: ${level.title}</p>
          <h3 class="text-xl font-black text-gray-800">Scene ${dialogueState.current + 1}</h3>
        </div>

        <!-- Character & Dialogue -->
        <div class="bg-white rounded-3xl shadow-sm p-6 md:p-8 mb-6 animate-slide-up">
          <div class="flex items-start gap-4 mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary/10 to-blue-50 flex items-center justify-center text-3xl flex-shrink-0">
              ${current.avatar}
            </div>
            <div class="flex-1">
              <p class="font-bold text-primary mb-1">${current.character}</p>
              <div class="dialogue-box bg-gray-50 rounded-2xl rounded-tl-sm p-4">
                <p class="text-gray-800 text-lg">${current.text}</p>
              </div>
            </div>
          </div>

          <!-- Choices -->
          <div class="space-y-3">
            <p class="text-sm font-semibold text-gray-500 mb-2">Choose your response:</p>
            ${current.choices.map((choice, i) => `
            <button onclick="selectChoice(${i})" 
              class="choice-btn w-full text-left p-4 rounded-2xl border-2 border-gray-200 ${dialogueState.answered ? (choice.correct ? 'correct' : 'incorrect') : ''}" 
              ${dialogueState.answered ? 'disabled' : ''}>
              <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg ${dialogueState.answered && choice.correct ? 'bg-green-100 text-green-700' : dialogueState.answered && !choice.correct ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'} flex items-center justify-center font-bold text-sm">${String.fromCharCode(65+i)}</span>
                <span class="font-medium text-gray-700">${choice.text}</span>
                ${dialogueState.answered && choice.correct ? '<span class="ml-auto text-green-500">✓</span>' : ''}
                ${dialogueState.answered && !choice.correct ? '<span class="ml-auto text-red-400">✗</span>' : ''}
              </div>
              ${dialogueState.answered ? `<p class="mt-2 text-sm ${choice.correct ? 'text-green-600' : 'text-red-500'} pl-11">${choice.feedback}</p>` : ''}
            </button>`).join('')}
          </div>
        </div>

        ${dialogueState.answered ? `
        <div class="text-center">
          <button onclick="nextDialogue()" class="btn-primary text-white px-8 py-3 rounded-2xl font-bold">
            ${dialogueState.current < levelDialogues.length - 1 ? 'Next →' : 'Complete Level 🎉'}
          </button>
        </div>` : ''}
      </div>
    </main>
  </div>`;
}

function selectChoice(index) {
  if (dialogueState.answered) return;
  dialogueState.answered = true;
  const levelDialogues = dialogues[dialogueState.levelId] || dialogues[1];
  const current = levelDialogues[dialogueState.current];
  if (current.choices[index].correct) {
    dialogueState.score++;
    addXP(20);
    gameState.player.coins += 5;
  }
  render();
}

function nextDialogue() {
  const levelDialogues = dialogues[dialogueState.levelId] || dialogues[1];
  if (dialogueState.current < levelDialogues.length - 1) {
    dialogueState.current++;
    dialogueState.answered = false;
    render();
  } else {
    dialogueState.completed = true;
    if (!gameState.player.completedLevels.includes(dialogueState.levelId)) {
      gameState.player.completedLevels.push(dialogueState.levelId);
      if (dialogueState.levelId < 8) {
        levels[dialogueState.levelId].unlocked = true;
        gameState.player.currentLevel = dialogueState.levelId + 1;
      }
    }
    gameState.player.stats.english = Math.min(100, gameState.player.stats.english + 5);
    gameState.player.stats.academic = Math.min(100, gameState.player.stats.academic + 3);
    gameState.player.stats.social = Math.min(100, gameState.player.stats.social + 4);
    render();
  }
}

function renderLevelComplete() {
  const level = levels[dialogueState.levelId - 1];
  const levelDialogues = dialogues[dialogueState.levelId] || dialogues[1];
  const percentage = Math.round((dialogueState.score / levelDialogues.length) * 100);
  const stars = percentage >= 90 ? 3 : percentage >= 60 ? 2 : 1;
  
  return `
  <div class="h-full flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 max-w-md w-full text-center animate-slide-up">

      <h2 class="text-2xl font-black text-gray-900 mb-2">Level Complete!</h2>
      <p class="text-gray-500 mb-6">${level.title}</p>
      
      <div class="flex justify-center gap-2 mb-6">
        ${Array(3).fill(0).map((_, i) => `<span class="text-4xl ${i < stars ? '' : 'opacity-20'}">${i < stars ? '⭐' : '☆'}</span>`).join('')}
      </div>
      
      <div class="bg-gray-50 rounded-2xl p-4 mb-6">
        <div class="grid grid-cols-3 gap-4">
          <div>
            <p class="text-2xl font-black text-primary">${dialogueState.score}/${levelDialogues.length}</p>
            <p class="text-xs text-gray-500">Correct</p>
          </div>
          <div>
            <p class="text-2xl font-black text-secondary">+${dialogueState.score * 20}</p>
            <p class="text-xs text-gray-500">XP Earned</p>
          </div>
          <div>
            <p class="text-2xl font-black text-green-500">+${dialogueState.score * 5}</p>
            <p class="text-xs text-gray-500">Coins</p>
          </div>
        </div>
      </div>
      
      <div class="flex flex-col gap-3">
        <button onclick="gameState.currentScreen='story';render()" class="btn-primary text-white px-6 py-3 rounded-2xl font-bold">
          Continue Journey →
        </button>
        <button onclick="startLevel(${dialogueState.levelId})" class="bg-gray-100 text-gray-700 px-6 py-3 rounded-2xl font-bold hover:bg-gray-200 transition-colors">
          Replay Level
        </button>
      </div>
    </div>
  </div>`;
}

function startMiniGame(id) {
  if (id === 'vocab') {
    vocabGameState = { current: 0, score: 0, answered: false };
    gameState.currentScreen = 'vocab_game';
  } else if (id === 'grammar') {
    grammarGameState = { current: 0, score: 0, userAnswer: '', submitted: false };
    gameState.currentScreen = 'grammar_game';
  } else {
    vocabGameState = { current: 0, score: 0, answered: false };
    gameState.currentScreen = 'vocab_game';
  }
  render();
}

function renderVocabGame() {
  const word = vocabWords[vocabGameState.current];
  if (!word) return renderMiniGameComplete('Vocabulary Battle', vocabGameState.score, vocabWords.length);
  
  return `
  <div class="h-full flex flex-col">
    ${renderNav()}
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
          <button onclick="gameState.currentScreen='minigames';render()" class="flex items-center gap-2 text-gray-500 hover:text-gray-800">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Back
          </button>
          <span class="font-bold text-primary">${vocabGameState.current + 1}/${vocabWords.length}</span>
        </div>
        
        <div class="bg-white rounded-3xl shadow-sm p-8 text-center mb-6">
          <p class="text-sm font-semibold text-primary mb-2">⚔️ VOCABULARY BATTLE</p>
          <h3 class="text-3xl font-black text-gray-900 mb-2">${word.word}</h3>
          <p class="text-gray-500 mb-8">What does this word mean?</p>
          
          <div class="grid gap-3">
            ${word.options.map((opt, i) => `
            <button onclick="answerVocab(${i})" 
              class="choice-btn p-4 rounded-2xl border-2 border-gray-200 text-left font-medium ${vocabGameState.answered ? (opt === word.meaning ? 'correct' : 'incorrect') : ''}"
              ${vocabGameState.answered ? 'disabled' : ''}>
              ${opt}
              ${vocabGameState.answered && opt === word.meaning ? ' ✓' : ''}
            </button>`).join('')}
          </div>
        </div>
        
        ${vocabGameState.answered ? `
        <div class="text-center">
          <button onclick="nextVocab()" class="btn-primary text-white px-8 py-3 rounded-2xl font-bold">Next Word →</button>
        </div>` : ''}
      </div>
    </main>
  </div>`;
}

function answerVocab(index) {
  if (vocabGameState.answered) return;
  vocabGameState.answered = true;
  if (vocabWords[vocabGameState.current].options[index] === vocabWords[vocabGameState.current].meaning) {
    vocabGameState.score++;
    addXP(15);
  }
  render();
}

function nextVocab() {
  vocabGameState.current++;
  vocabGameState.answered = false;
  render();
}

function renderGrammarGame() {
  const q = grammarQuestions[grammarGameState.current];
  if (!q) return renderMiniGameComplete('Grammar Fix', grammarGameState.score, grammarQuestions.length);
  
  return `
  <div class="h-full flex flex-col">
    ${renderNav()}
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
          <button onclick="gameState.currentScreen='minigames';render()" class="flex items-center gap-2 text-gray-500 hover:text-gray-800">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Back
          </button>
          <span class="font-bold text-primary">${grammarGameState.current + 1}/${grammarQuestions.length}</span>
        </div>
        
        <div class="bg-white rounded-3xl shadow-sm p-8 mb-6">
          <p class="text-sm font-semibold text-primary mb-4">🔧 GRAMMAR FIX</p>
          <p class="text-gray-500 mb-2">Fix the error in this sentence:</p>
          <div class="bg-red-50 border border-red-200 rounded-2xl p-4 mb-6">
            <p class="text-lg font-medium text-red-700">"${q.sentence}"</p>
          </div>
          
          <label for="grammar-input" class="text-sm font-semibold text-gray-600 mb-2 block">Your correction:</label>
          <input id="grammar-input" type="text" 
            value="${grammarGameState.userAnswer}" 
            oninput="grammarGameState.userAnswer=this.value"
            class="w-full p-4 border-2 border-gray-200 rounded-2xl text-lg focus:border-primary focus:outline-none transition-colors"
            placeholder="Type the correct sentence..."
            ${grammarGameState.submitted ? 'disabled' : ''}>
          
          ${grammarGameState.submitted ? `
          <div class="mt-4 p-4 rounded-2xl ${grammarGameState.userAnswer.trim().toLowerCase() === q.correct.toLowerCase() ? 'bg-green-50 border border-green-200' : 'bg-orange-50 border border-orange-200'}">
            <p class="font-bold ${grammarGameState.userAnswer.trim().toLowerCase() === q.correct.toLowerCase() ? 'text-green-700' : 'text-orange-700'}">
              ${grammarGameState.userAnswer.trim().toLowerCase() === q.correct.toLowerCase() ? '✓ Correct!' : '✗ Not quite!'}
            </p>
            <p class="text-sm text-gray-600 mt-1">Answer: "${q.correct}"</p>
            <p class="text-sm text-gray-500 mt-1">💡 ${q.hint}</p>
          </div>` : ''}
          
          <div class="mt-6 text-center">
            ${!grammarGameState.submitted ? `
            <button onclick="submitGrammar()" class="btn-primary text-white px-8 py-3 rounded-2xl font-bold">Check Answer</button>
            ` : `
            <button onclick="nextGrammar()" class="btn-primary text-white px-8 py-3 rounded-2xl font-bold">Next →</button>
            `}
          </div>
        </div>
      </div>
    </main>
  </div>`;
}

function submitGrammar() {
  grammarGameState.submitted = true;
  const q = grammarQuestions[grammarGameState.current];
  if (grammarGameState.userAnswer.trim().toLowerCase() === q.correct.toLowerCase()) {
    grammarGameState.score++;
    addXP(20);
  }
  render();
}

function nextGrammar() {
  grammarGameState.current++;
  grammarGameState.userAnswer = '';
  grammarGameState.submitted = false;
  render();
}

function renderMiniGameComplete(gameName, score, total) {
  const percentage = Math.round((score/total)*100);
  return `
  <div class="h-full flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 max-w-md w-full text-center animate-slide-up">
      <div class="text-6xl mb-4">${percentage >= 80 ? '🏆' : percentage >= 50 ? '👍' : '💪'}</div>
      <h2 class="text-2xl font-black text-gray-900 mb-2">${gameName} Complete!</h2>
      <p class="text-4xl font-black text-primary my-4">${score}/${total}</p>
      <p class="text-gray-500 mb-6">${percentage}% correct</p>
      <div class="flex flex-col gap-3">
        <button onclick="gameState.currentScreen='minigames';render()" class="btn-primary text-white px-6 py-3 rounded-2xl font-bold">Play More Games</button>
        <button onclick="gameState.currentScreen='dashboard';render()" class="bg-gray-100 text-gray-700 px-6 py-3 rounded-2xl font-bold">Back to Dashboard</button>
      </div>
    </div>
  </div>`;
}

function renderResults() {
  const totalScore = Math.round((gameState.player.stats.academic + gameState.player.stats.english + gameState.player.stats.social + gameState.player.stats.happiness) / 4);
  const grade = totalScore >= 80 ? 'Excellent' : totalScore >= 60 ? 'Good' : 'Needs Improvement';
  const gradeEmoji = totalScore >= 80 ? '🌟' : totalScore >= 60 ? '👏' : '💪';
  const gradeMsg = totalScore >= 80 ? 'You received a scholarship and became one of the top students!' : totalScore >= 60 ? 'You successfully completed your first semester abroad!' : 'You passed but still need more English practice. Keep going!';
  
  return `
  <div class="h-full flex flex-col">
    ${renderNav()}
    <div class="flex flex-1 overflow-hidden">
      ${renderSidebar()}
      <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="max-w-3xl mx-auto">
          <div class="bg-white rounded-3xl shadow-sm p-8 md:p-12 text-center mb-8">
            <div class="text-6xl mb-4">${gradeEmoji}</div>
            <h2 class="text-3xl font-black text-gray-900 mb-2">Semester Report</h2>
            <p class="text-lg text-gray-500 mb-2">${grade} Student</p>
            <p class="text-gray-600 max-w-md mx-auto mb-8">${gradeMsg}</p>
            
            <div class="inline-flex items-center gap-2 bg-primary/10 rounded-full px-6 py-3 mb-8">
              <span class="text-3xl font-black text-primary">${totalScore}%</span>
              <span class="text-gray-500 font-semibold">Overall Score</span>
            </div>

            <!-- Stats breakdown -->
            <div class="grid sm:grid-cols-2 gap-4 text-left max-w-lg mx-auto">
              ${[
                {label:'Academic Score',emoji:'📚',value:gameState.player.stats.academic,color:'blue'},
                {label:'English Skill',emoji:'🗣️',value:gameState.player.stats.english,color:'green'},
                {label:'Social Life',emoji:'👥',value:gameState.player.stats.social,color:'orange'},
                {label:'Happiness',emoji:'😊',value:gameState.player.stats.happiness,color:'pink'}
              ].map(s => `
              <div class="bg-gray-50 rounded-2xl p-4">
                <div class="flex items-center gap-2 mb-2">
                  <span>${s.emoji}</span>
                  <span class="text-sm font-semibold text-gray-600">${s.label}</span>
                  <span class="ml-auto font-bold text-${s.color}-600">${s.value}%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                  <div class="bg-${s.color}-500 rounded-full h-2.5 animate-progress" style="width:${s.value}%"></div>
                </div>
              </div>`).join('')}
            </div>
          </div>

          <!-- Achievements summary -->
          <div class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="font-bold text-gray-800 mb-4">Achievements Earned</h3>
            <div class="flex flex-wrap gap-3">
              ${achievements.filter(a => a.earned).map(a => `
              <div class="flex items-center gap-2 bg-yellow-50 rounded-full px-4 py-2">
                <span class="text-xl">${a.emoji}</span>
                <span class="text-sm font-semibold text-yellow-700">${a.name}</span>
              </div>`).join('')}
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>`;
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.toggle('hidden');
}

// Element SDK
const defaultConfig = {
  game_title: 'Campus Journey',
  subtitle: 'Master English Through University Life',
  background_color: '#F8FAFC',
  surface_color: '#FFFFFF',
  text_color: '#1F2937',
  primary_color: '#2563EB',
  secondary_color: '#F59E0B',
  font_family: 'Nunito',
  font_size: 16
};

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    document.body.style.backgroundColor = config.background_color || defaultConfig.background_color;
    const title = document.getElementById('main-title');
    const sub = document.getElementById('main-subtitle');
    if (title) title.innerHTML = (config.game_title || defaultConfig.game_title).replace('Journey', '<span class="text-primary">Journey</span>');
    if (sub) sub.textContent = config.subtitle || defaultConfig.subtitle;
    document.body.style.fontFamily = `${config.font_family || defaultConfig.font_family}, sans-serif`;
    const size = config.font_size || defaultConfig.font_size;
    document.documentElement.style.fontSize = `${size}px`;
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
      { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ['game_title', config.game_title || defaultConfig.game_title],
    ['subtitle', config.subtitle || defaultConfig.subtitle]
  ])
});

// Initial render
render();
